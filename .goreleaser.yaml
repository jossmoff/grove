version: 2

builds:
  - main: ./cmd/grove
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

brews:
  - name: grove
    repository:
      owner: jossmoff
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jossmoff/grove
    description: "Multi-repo agent workspaces backed by git worktrees"
