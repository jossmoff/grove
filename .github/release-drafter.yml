name-template: 'v$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
categories:
  - title: 'Features'
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: 'Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
  - title: 'Maintenance'
    when:
      labels:
        - 'dependencies'
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - 'minor'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'patch'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  default: patch
template: |
  ## Changes

  $CHANGES
